<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient cánh hoa hướng dương -->
    <linearGradient id="sunflowerPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <!-- Gradient nhụy hoa hướng dương -->
    <radialGradient id="sunflowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="65%" stop-color="#54280E" />
      <stop offset="100%" stop-color="#2D1305" />
    </radialGradient>
  </defs>

  <!-- Các cánh hoa hướng dương (16 cánh đối xứng tròn) -->
  <g transform="translate(32, 32)">
    <!-- Vòng cánh sau -->
    <g opacity="0.9">
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(11.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(33.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(56.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(78.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(101.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(123.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(146.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(168.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(191.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(213.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(236.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(258.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(281.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(303.75)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(326.25)" />
      <ellipse cx="0" cy="-24" rx="4.5" ry="8" fill="url(#sunflowerPetal)" transform="rotate(348.75)" />
    </g>

    <!-- Vòng cánh chính -->
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(22.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(45)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(67.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(90)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(112.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(135)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(157.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(180)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(202.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(225)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(247.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(270)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(292.5)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(315)" />
    <ellipse cx="0" cy="-22" rx="5" ry="9" fill="url(#sunflowerPetal)" transform="rotate(337.5)" />

    <!-- Nhụy hoa hướng dương -->
    <circle cx="0" cy="0" r="14" fill="url(#sunflowerCenter)" stroke="#CA8A04" stroke-width="1.5" />
    
    <!-- Hạt hướng dương trang trí -->
    <circle cx="-5" cy="-5" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="0" cy="-6" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="5" cy="-5" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="-6" cy="0" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="6" cy="0" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="-4" cy="5" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="0" cy="6" r="1" fill="#FDE047" opacity="0.6" />
    <circle cx="4" cy="5" r="1" fill="#FDE047" opacity="0.6" />
  </g>
</svg>
